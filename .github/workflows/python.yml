name: Python AI Service CI

on:
  push:
    paths:
      - 'services/python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'services/python/**'

defaults:
  run:
    working-directory: services/python/ai-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test with coverage
        # pyproject.toml has `addopts = "--cov=app --cov-report=xml --cov-report=term-missing"`
        # so the XML lands at coverage.xml by default. No --cov-fail-under here:
        # the threshold gate is codecov.yml's per-flag project status rule.
        run: uv run pytest

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/python/ai-service/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage XML as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: services/python/ai-service/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
