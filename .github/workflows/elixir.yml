name: Elixir Services CI

on:
  push:
    paths:
      - 'services/elixir/**'
      - '.github/workflows/elixir.yml'
  pull_request:
    paths:
      - 'services/elixir/**'

defaults:
  run:
    working-directory: services/elixir

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medfund
          POSTGRES_PASSWORD: medfund
          POSTGRES_DB: medfund
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U medfund"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test with ExCoveralls (gate enforced at 70%)
        # `mix coveralls.json` writes cover/excoveralls.json which the Codecov
        # action picks up. We standardise on Codecov rather than coveralls.io
        # so the per-flag dashboard stays unified across all five languages.
        # services/elixir/coveralls.json sets `minimum_coverage: 70`; mix exits
        # non-zero per-app when below — failing apps listed in
        # .claude/coverage-backlog.md must close their gap before merge.
        run: mix coveralls.json --umbrella
        env:
          MIX_ENV: test

      - name: Upload Elixir coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/elixir/cover/excoveralls.json
          flags: elixir
          name: elixir-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
