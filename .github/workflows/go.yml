name: Go Services CI

on:
  push:
    branches: [main]
    paths:
      - 'services/go/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'services/go/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/go

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all services
        run: |
          for dir in gateway notification-service audit-service file-service payment-gateway; do
            echo "Building $dir..."
            (cd $dir && go build ./...)
          done

      - name: Test all services with coverage
        # -race catches concurrency regressions in middleware / consumer code;
        # -coverprofile emits a per-service profile uploaded to Codecov.
        # No -tags=integration: those use dockertest and run under
        # `make test-integration` instead.
        run: |
          set -e
          for dir in gateway notification-service audit-service file-service payment-gateway; do
            echo "Testing $dir..."
            (cd $dir && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
          done

      - name: Per-service coverage threshold check (enforced)
        # Hard gate at 70% line coverage per service. `go test` has no native
        # threshold flag, so we parse `go tool cover -func` totals. Any service
        # below the bar fails the job. Failing services listed in
        # .claude/coverage-backlog.md must close their gap before merge.
        run: |
          THRESHOLD=70
          FAILED=()
          for dir in gateway notification-service audit-service file-service payment-gateway; do
            PCT=$(go tool cover -func=$dir/coverage.out 2>/dev/null | awk '/total:/ {gsub("%",""); print $3}')
            if [ -z "$PCT" ]; then
              echo "::error::$dir produced no coverage data"
              FAILED+=("$dir (no data)")
              continue
            fi
            echo "$dir coverage: ${PCT}% (threshold: ${THRESHOLD}%)"
            if awk "BEGIN {exit !($PCT < $THRESHOLD)}"; then
              echo "::error::$dir is ${PCT}% — below the ${THRESHOLD}% gate"
              FAILED+=("$dir (${PCT}%)")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Coverage gate failed for: ${FAILED[*]}"
            exit 1
          fi

      - name: Vet
        run: |
          for dir in gateway notification-service audit-service file-service payment-gateway; do
            (cd $dir && go vet ./...)
          done

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            services/go/gateway/coverage.out
            services/go/notification-service/coverage.out
            services/go/audit-service/coverage.out
            services/go/file-service/coverage.out
            services/go/payment-gateway/coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
