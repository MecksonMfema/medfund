server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: user-service
  data:
    redis:
      host: localhost
      port: 6380
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/medfund
    username: medfund
    password: medfund
    pool:
      enabled: true
      initial-size: 5
      max-size: 30
      max-idle-time: 30m
      max-acquire-time: 10s
      max-life-time: 1h
      validation-query: SELECT 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080/realms/medfund-platform

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

kafka:
  bootstrap-servers: localhost:9092

keycloak:
  admin:
    url: http://localhost:9080
    username: admin
    password: admin
  client:
    id: medfund-web   # OIDC client — embedded in Keycloak invite email links

services:
  tenancy:
    base-url: http://localhost:8081
