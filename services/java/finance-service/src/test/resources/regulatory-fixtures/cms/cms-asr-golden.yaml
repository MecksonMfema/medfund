  RATIO_NON_HEALTHCARE:                        0.1300
  RATIO_ADMIN:                                 0.0800
  RATIO_BROKER:                                0.0300
  RATIO_MANAGED_CARE:                          0.0200

  # Solvency (all values two-decimal HALF_UP where applicable; ratios 4-dp)
  #   accumulated_funds = 250,000,000 - 100,000,000 = 150,000,000
  #   min_required_reserves = 500,000,000 * 0.25 = 125,000,000
  #   actual_ratio = 150,000,000 / 500,000,000 (4 dp HALF_UP) = 0.3000
  #   surplus_deficit = 150,000,000 - 125,000,000 = 25,000,000
  SOL_ACCUMULATED_FUNDS:           150000000.00
  SOL_MIN_REQUIRED_RESERVES:       125000000.00
  SOL_ACTUAL_RATIO:                        0.3000
  SOL_MIN_REQUIRED_RATIO:                  0.2500
  SOL_SURPLUS_DEFICIT:              25000000.00
  meets_minimum:                             true
