  #   accumulated_funds = 250,000,000 - 100,000,000 = 150,000,000
  BS_TOTAL_ASSETS:                 250000000.00
  BS_TOTAL_LIABILITIES:            100000000.00
  BS_ACCUMULATED_FUNDS:            150000000.00

  # Income statement
  #   non_healthcare_total = 40M + 15M + 10M = 65,000,000
  #   net_surplus = 490M - 400M - 65M = 25,000,000
  INC_GROSS_CONTRIBUTIONS:         500000000.00
  INC_NET_CONTRIBUTIONS:           490000000.00
  INC_RISK_CLAIMS_INCURRED:        400000000.00
  INC_ADMIN_EXPENSES:               40000000.00
  INC_BROKER_FEES:                  15000000.00
  INC_MANAGED_CARE_FEES:            10000000.00
  INC_NON_HEALTHCARE_TOTAL:         65000000.00
  INC_NET_SURPLUS:                  25000000.00

  # Cost ratios (all against gross_contributions = 500,000,000)
  #   claims_ratio        = 400,000,000 / 500,000,000 = 0.8000
  #   non_healthcare_ratio =  65,000,000 / 500,000,000 = 0.1300
  #   admin_ratio         =  40,000,000 / 500,000,000 = 0.0800
  #   broker_ratio        =  15,000,000 / 500,000,000 = 0.0300
  #   managed_care_ratio  =  10,000,000 / 500,000,000 = 0.0200
