server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: tenancy-service
  data:
    redis:
      host: localhost
      port: 6380
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/medfund
    username: medfund
    password: medfund
  flyway:
    url: jdbc:postgresql://localhost:5433/medfund
    user: medfund
    password: medfund
    schemas: public
    baseline-on-migrate: true
    # Run both public and tenant migrations in the public schema for local dev.
    # In production, tenant migrations run per-schema via SchemaProvisioningService.
    locations: classpath:db/migration/public,classpath:db/migration/tenant
    # out-of-order: tenant migrations (V001..) and public migrations (V100..)
    # share this history table in dev, so a newly-added tenant V00X often arrives
    # AFTER higher-numbered V1XX entries are already applied. Production runs them
    # in separate schema histories, so this is a dev-only allowance.
    out-of-order: true
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080/realms/medfund-platform

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0

kafka:
  bootstrap-servers: localhost:9092
