<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><title>{{.HeadlineShort}}</title></head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1f2937;max-width:600px;margin:24px auto;padding:0 16px">
  <p>Hi {{.DisplayName}},</p>
  <p>{{.Lead}}</p>

  {{if .ReasonLine}}
  <p style="background:#f9fafb;padding:12px 16px;border-left:3px solid #d1d5db;font-size:13px;color:#4b5563">
    <strong>Reason:</strong> {{.ReasonLine}}
  </p>
  {{end}}

  <p>{{.CallToAction}}</p>

  <p style="color:#5b6371;font-size:12px;margin-top:32px">You're receiving this message because a status change was applied to your account. If you weren't expecting it, contact your account manager.</p>
</body>
</html>
