<header class="page-header">
  <div>
    <h1>Schemes</h1>
    <p class="page-sub">Benefit schemes available in this tenant. Currency is locked at the scheme level, every contribution and benefit on a scheme inherits it.</p>
  </div>
  <a *hasPermission="'billing:manage_schemes'" class="btn btn-primary" routerLink="/tenant/billing/schemes/add">
    <app-icon name="plus" [size]="14"></app-icon>
    Add scheme
  </a>
</header>

@if (showTabs) {
  <nav class="scheme-tabs" role="tablist" aria-label="Filter schemes by insurance line">
    @for (tab of tabs; track tab.value) {
      <button
        type="button"
        role="tab"
        class="scheme-tab"
        [class.is-active]="activeTab === tab.value"
        [attr.aria-selected]="activeTab === tab.value"
        (click)="selectTab(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </nav>
}

<app-data-table
  [columns]="schemeColumns"
  [data]="schemes"
  [actions]="schemeActions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  (sortChange)="onSort($event)"
  (searchChange)="onSearch($event)"
  (pageChange)="onPageChange($event)">
</app-data-table>
