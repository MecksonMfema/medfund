<div class="page">
  <header class="page-header">
    <div>
      <h1>Members</h1>
      <p class="page-sub">Active and historical members across all schemes. Click a row to view, edit, or manage that member's dependants.</p>
    </div>
    <a class="btn btn-primary" routerLink="/tenant/members/add">
      <app-icon name="plus" [size]="14"></app-icon>
      Add member
    </a>
  </header>

  <div class="search-bar">
    <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearch()" placeholder="Search by name or member number..." />
  </div>

  <app-data-table
    title="Member List"
    [columns]="columns"
    [data]="members"
    [loading]="loading"
    [serverSide]="true"
    [searchable]="false"
    [hasPrev]="hasPrev"
    [hasNext]="hasNext"
    (rowClick)="onRowClick($event)"
    (prevPage)="prevPage()"
    (nextPage)="nextPage()">
  </app-data-table>
</div>
