<header class="page-header">
  <div>
    <h1>Members</h1>
    <p class="page-sub">Active and historical members across all schemes. Click a row to view, edit, or manage that member's dependants.</p>
  </div>
  <a *hasPermission="'members:create'" class="btn btn-primary" routerLink="/tenant/members/add">
    <app-icon name="plus" [size]="14"></app-icon>
    Add member
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="members"
  [loading]="loading"
  [serverSide]="true"
  searchPlaceholder="Search by name or member number…"
  emptyMessage="No members enrolled yet."
  [hasPrev]="hasPrev"
  [hasNext]="hasNext"
  (rowClick)="onRowClick($event)"
  (searchChange)="onSearch($event)"
  (prevPage)="prevPage()"
  (nextPage)="nextPage()">
</app-data-table>
