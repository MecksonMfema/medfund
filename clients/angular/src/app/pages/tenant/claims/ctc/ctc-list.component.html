<header class="page-header">
  <div>
    <h1>{{ committed ? 'Committed CTC payments' : 'Pending CTC payments' }}</h1>
    <p class="page-sub">
      Cash-to-cardholder allocations —
      {{ committed ? 'locked and posted to member ledgers.' : 'awaiting commit; still editable.' }}
    </p>
  </div>
  <div class="header-actions">
    <a class="btn btn-primary" routerLink="/tenant/claims/ctc/add" *hasPermission="'claims:commit_ctc_payment'">
      <app-icon name="plus" [size]="14"></app-icon>
      New CTC payment
    </a>
    <a class="btn btn-default" [routerLink]="committed ? '/tenant/claims/ctc/pending' : '/tenant/claims/ctc/committed'">
      {{ committed ? 'Pending' : 'Committed' }}
    </a>
  </div>
</header>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search member name, member number or group name"
  [emptyMessage]="committed ? 'No committed CTC payments' : 'No pending CTC payments'"
  emptyDescription="New allocations will appear here once they're recorded."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
