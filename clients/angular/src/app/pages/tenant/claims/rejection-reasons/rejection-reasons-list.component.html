<header class="page-header">
  <div>
    <h1>Rejection reasons</h1>
    <p class="page-sub">Catalogue of R-codes referenced by the adjudication pipeline and manual rejection flows. The platform seeds R01–R18; you can add tenant-specific codes or deactivate ones you don't use.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/claims/rejection-reasons/add">
    <app-icon name="plus" [size]="14"></app-icon>
    Add reason
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search code, description or category"
  emptyMessage="No rejection reasons configured"
  emptyDescription="Add the first R-code above to seed the catalogue."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
