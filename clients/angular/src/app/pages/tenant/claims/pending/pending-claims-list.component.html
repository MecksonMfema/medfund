<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">{{ pageDescription }}</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/claims/submit">
    <app-icon name="plus" [size]="14"></app-icon>
    Submit claim
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

@if (!presetStatus) {
  <div class="filter-strip">
    <label class="field">
      <span class="field-label">Status</span>
      <app-select
        [(ngModel)]="statusFilter"
        (selectionChange)="onStatusChange()"
        name="status"
        [options]="statusFilterOptions"
        size="sm"
        placeholder="All"
      ></app-select>
    </label>
  </div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search claim #, member name, provider or member number"
  emptyMessage="No claims match these filters"
  emptyDescription="Adjust the status filter or wait for new claims to arrive."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
