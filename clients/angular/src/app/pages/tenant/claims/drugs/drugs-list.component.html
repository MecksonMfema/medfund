<header class="page-header">
  <div>
    <h1>Drug catalogue</h1>
    <p class="page-sub">The tenant formulary. Drug type drives adjudication treatment — chronic items often need pre-auth, off-limit drugs are auto-rejected.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/claims/drugs/add">
    <app-icon name="plus" [size]="14"></app-icon>
    Add drug
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search drug name, tariff or type"
  emptyMessage="No drugs in the formulary yet"
  emptyDescription="Add the first drug above to seed the catalogue."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
