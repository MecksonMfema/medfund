<header class="page-header">
  <div>
    <h1>Tariff schedules</h1>
    <p class="page-sub">A schedule is a versioned set of tariff codes effective between two dates. The adjudication pipeline reads from the active schedule when validating per-line pricing.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/claims/tariffs/add">
    <app-icon name="plus" [size]="14"></app-icon>
    New schedule
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search name or source"
  emptyMessage="No tariff schedules yet"
  emptyDescription="Create the first one to start adding tariff codes.">
</app-data-table>
