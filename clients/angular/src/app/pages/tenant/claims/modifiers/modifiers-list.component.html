<header class="page-header">
  <div>
    <h1>Tariff modifiers</h1>
    <p class="page-sub">Adjustments applied to a tariff line at adjudication time — bilateral, after-hours, assistant, etc. Modifiers are managed centrally; tenants pick from the catalogue when claiming.</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [showActions]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search code, name or description"
  emptyMessage="No tariff modifiers configured"
  emptyDescription="The platform team seeds these when standard procedure modifiers are agreed."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
