<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">
      Payments where a portion was withheld as tax before payout. Drawn from
      adjustments of type <code>TAX_WITHHELD</code>.
    </p>
  </div>
</header>

<div class="filter-strip">
  <label class="field">
    <span class="field-label">Status</span>
    <app-select
      [(ngModel)]="statusFilter"
      (selectionChange)="onStatusChange()"
      name="status"
      [options]="statusOptions"
      size="sm"
      placeholder="All statuses"
    ></app-select>
  </label>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [showActions]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search adj #, reason, member or provider"
  emptyMessage="No tax-withheld records"
  emptyDescription="Records show up here once tax-withheld adjustments are posted."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
