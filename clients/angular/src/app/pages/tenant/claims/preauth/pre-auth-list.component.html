<header class="page-header">
  <div>
    <h1>Pre-authorizations</h1>
    <p class="page-sub">Approval requests for elective and high-cost services. The adjudication pipeline rejects claims for tariff codes that require pre-auth and don't have a matching approved record.</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<nav class="scheme-tabs" role="tablist" aria-label="Filter pre-authorizations by status">
  @for (tab of statusTabs; track tab.value) {
    <button
      type="button"
      role="tab"
      class="scheme-tab"
      [class.is-active]="activeStatus === tab.value"
      [attr.aria-selected]="activeStatus === tab.value"
      (click)="selectStatus(tab.value)"
    >
      {{ tab.label }}
    </button>
  }
</nav>

<app-data-table
  [columns]="columns"
  [data]="filtered"
  [actions]="actions"
  [showActions]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search auth #, tariff, or diagnosis"
  emptyMessage="No pre-authorizations yet"
  emptyDescription="Submit a request from a scheme that requires prior approval and it'll appear here.">
</app-data-table>
