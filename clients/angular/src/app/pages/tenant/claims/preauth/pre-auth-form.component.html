<div class="form-page">
  <header class="page-header">
    <div>
      <h1>New pre-authorization request</h1>
      <p class="page-sub">Submit a request for prior approval. Once approved, claims for the same member + tariff code will pass the pipeline's pre-auth stage automatically.</p>
    </div>
    <a class="btn btn-default" routerLink="/tenant/claims/preauth">
      <app-icon name="arrow-left" [size]="14"></app-icon>
      Back
    </a>
  </header>

  @if (errorMessage) {
    <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
  }

  <form (submit)="$event.preventDefault(); submit()" class="card">
    <label class="field">
      <span class="field-label">Member *</span>
      @if (selectedMember) {
        <div class="selected-pill">
          <div class="selected-info">
            <strong>{{ selectedMember.label }}</strong>
            @if (selectedMember.sublabel) { <span class="muted">{{ selectedMember.sublabel }}</span> }
          </div>
          <button type="button" class="link-btn" (click)="clearMember()">Change</button>
        </div>
      } @else {
        <div class="search-wrapper">
          <input type="text" [(ngModel)]="memberQuery" (ngModelChange)="onMemberQueryChange()"
                 (focus)="showMemberMatches = true" name="memberQuery"
                 placeholder="Search by member name…" autocomplete="off" />
          @if (showMemberMatches && memberQuery.trim()) {
            <ul class="suggestions">
              @if (memberSearching) { <li class="suggestion muted">Searching…</li> }
              @else if (memberMatches.length === 0) { <li class="suggestion muted">No matches</li> }
              @else {
                @for (m of memberMatches; track m.id) {
                  <li class="suggestion" (click)="pickMember(m)">
                    <strong>{{ m.label }}</strong>
                    @if (m.sublabel) { <span class="muted">— {{ m.sublabel }}</span> }
                  </li>
                }
              }
            </ul>
          }
        </div>
      }
    </label>

    <label class="field">
      <span class="field-label">Provider *</span>
      @if (selectedProvider) {
        <div class="selected-pill">
          <div class="selected-info">
            <strong>{{ selectedProvider.label }}</strong>
            @if (selectedProvider.sublabel) { <span class="muted">{{ selectedProvider.sublabel }}</span> }
          </div>
          <button type="button" class="link-btn" (click)="clearProvider()">Change</button>
        </div>
      } @else {
        <div class="search-wrapper">
          <input type="text" [(ngModel)]="providerQuery" (ngModelChange)="onProviderQueryChange()"
                 (focus)="showProviderMatches = true" name="providerQuery"
                 placeholder="Search providers…" autocomplete="off" />
          @if (showProviderMatches && providerQuery.trim()) {
            <ul class="suggestions">
              @if (providerSearching) { <li class="suggestion muted">Searching…</li> }
              @else if (providerMatches.length === 0) { <li class="suggestion muted">No matches</li> }
              @else {
                @for (p of providerMatches; track p.id) {
                  <li class="suggestion" (click)="pickProvider(p)">
                    <strong>{{ p.label }}</strong>
                    @if (p.sublabel) { <span class="muted">— {{ p.sublabel }}</span> }
                  </li>
                }
              }
            </ul>
          }
        </div>
      }
    </label>

    <div class="form-grid">
      <label class="field">
        <span class="field-label">Scheme *</span>
        <select [(ngModel)]="form.schemeId" name="schemeId" required>
          <option [value]="''" disabled>Pick a scheme</option>
          @for (s of schemes; track s.id) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span class="field-label">Currency *</span>
        <select [(ngModel)]="form.currencyCode" name="currencyCode" required>
          @for (c of currencies; track c.id) {
            <option [value]="c.currencyCode">{{ c.currencyCode }}{{ c.isDefault ? ' (default)' : '' }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span class="field-label">Tariff code *</span>
        <input type="text" [(ngModel)]="form.tariffCode" name="tariffCode" required placeholder="0001A" />
      </label>
      <label class="field">
        <span class="field-label">Diagnosis code</span>
        <input type="text" [(ngModel)]="form.diagnosisCode" name="diagnosisCode" placeholder="ICD-10 (e.g. C50.9)" />
      </label>
      <label class="field">
        <span class="field-label">Requested amount *</span>
        <input type="number" step="0.01" min="0" [(ngModel)]="form.requestedAmount" name="requestedAmount" required />
      </label>
    </div>

    <label class="field">
      <span class="field-label">Notes</span>
      <textarea [(ngModel)]="form.notes" name="notes" rows="3"
                placeholder="Clinical justification, treatment plan, supporting context…"></textarea>
    </label>

    <div class="form-actions">
      <a class="btn btn-default" routerLink="/tenant/claims/preauth">Cancel</a>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Submitting…' : 'Submit request' }}
      </button>
    </div>
  </form>
</div>
