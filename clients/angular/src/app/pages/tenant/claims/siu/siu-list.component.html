<header class="page-header">
  <div>
    <h1>SIU cases</h1>
    <p class="page-sub">
      Fraud investigations opened by the AI triage engine or manually by an
      officer. Click any row to review flags, add notes, and close the case.
    </p>
  </div>
</header>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [loading]="loading"
  initialSortKey="openedAt"
  initialSortDirection="desc"
  searchPlaceholder="Search case #, status or priority"
  emptyMessage="No SIU cases match these filters"
  emptyDescription="AI-flagged claims that meet the tenant's FRAUD_TRIAGE policy will land here automatically.">
  <div table-filters class="toolbar-cell cell-status">
    <span class="cell-label">Status</span>
    <app-select
      [(ngModel)]="statusFilter"
      (selectionChange)="onStatusChange()"
      name="status"
      [options]="statusFilterOptions"
      placeholder="All"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>
</app-data-table>
