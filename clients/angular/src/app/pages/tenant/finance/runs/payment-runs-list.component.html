<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">{{ pageDescription }}</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/finance/runs/generate">Generate run</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search run # or description"
  emptyMessage="No payment runs yet"
  emptyDescription="Generate a run to batch adjudicated claims into a payout."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
  @if (!presetStatus) {
    <div table-filters class="toolbar-cell cell-status">
      <span class="cell-label">Status</span>
      <app-select
        [(ngModel)]="statusFilter"
        (selectionChange)="onStatusChange()"
        name="status"
        [options]="statusOptions"
        placeholder="All"
        [searchable]="false"
        [autoSearchThreshold]="9999"
      ></app-select>
    </div>
  }
  <div table-filters class="toolbar-cell cell-payee-type">
    <span class="cell-label">Payee type</span>
    <app-select
      [(ngModel)]="payeeTypeFilter"
      (selectionChange)="onPayeeTypeChange()"
      name="payeeType"
      [options]="payeeTypeOptions"
      placeholder="All"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>
</app-data-table>
