<header class="page-header">
  <div>
    <h1>Bank reconciliations</h1>
    <p class="page-sub">Statement entries matched against system payments. Investigate differences before resolving.</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}
@if (successMessage) {
  <div class="banner banner-success" (click)="successMessage = null">{{ successMessage }}</div>
}

<div class="filter-strip">
  <label class="field">
    <span class="field-label">Status</span>
    <app-select
      [(ngModel)]="statusFilter"
      (selectionChange)="onStatusChange()"
      name="status"
      [options]="statusOptions"
      size="sm"
    ></app-select>
  </label>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search reference or notes"
  emptyMessage="No reconciliations match these filters"
  emptyDescription="Record a bank statement to begin reconciliation."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
