<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">{{ pageDescription }}</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search advice #, run #, provider or member"
  emptyMessage="No payment advices match these filters"
  emptyDescription="Advices are generated automatically when a payment run is executed."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
  <div table-filters class="toolbar-cell cell-payee-type">
    <span class="cell-label">Payee</span>
    <app-select
      [(ngModel)]="payeeTypeFilter"
      (selectionChange)="onFilterChange()"
      name="payeeType"
      [options]="payeeTypeOptions"
      placeholder="All"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>
  <div table-filters class="toolbar-cell cell-status">
    <span class="cell-label">Status</span>
    <app-select
      [(ngModel)]="statusFilter"
      (selectionChange)="onFilterChange()"
      name="status"
      [options]="statusOptions"
      placeholder="All"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>
  <div table-filters class="toolbar-cell cell-month">
    <span class="cell-label">Month</span>
    <input type="month"
           [(ngModel)]="monthFilter"
           (change)="onFilterChange()"
           name="monthFilter" />
  </div>
</app-data-table>
