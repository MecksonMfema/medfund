<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">{{ pageDescription }}</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

@if (!presetStatus) {
  <div class="filter-strip">
    <label class="field">
      <span class="field-label">Status</span>
      <app-select
        [(ngModel)]="statusFilter"
        (selectionChange)="onStatusChange()"
        name="status"
        [options]="statusOptions"
        size="sm"
      ></app-select>
    </label>
  </div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search payment #, reference, provider or member"
  emptyMessage="No payments match these filters"
  emptyDescription="Adjust the status filter, or wait for new payments to be recorded."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
