<header class="page-header">
  <div>
    <h1>{{ pageTitle() }}</h1>
    <p class="page-sub">{{ pageDescription() }}</p>
  </div>
  <button class="btn btn-primary" (click)="newNote()" [disabled]="showForm">Record note</button>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}
@if (successMessage) {
  <div class="banner banner-success" (click)="successMessage = null">{{ successMessage }}</div>
}

@if (showForm) {
  <form (ngSubmit)="submit()" class="add-form card form-grid">
    <label class="field">
      <span class="field-label">Amount *</span>
      <input type="number" step="0.01" min="0" [(ngModel)]="form.amount" name="amount" required />
    </label>
    <label class="field">
      <span class="field-label">Currency *</span>
      <app-select
        [(ngModel)]="form.currencyCode"
        name="currencyCode"
        [options]="currencyOptions"
        placeholder="Pick a currency"
        required
      ></app-select>
    </label>
    <label class="field span-2">
      <span class="field-label">Reference</span>
      <input type="text" [(ngModel)]="form.reference" name="reference" placeholder="Cheque #, txn ref, etc." />
    </label>
    <label class="field span-2">
      <span class="field-label">Notes</span>
      <input type="text" [(ngModel)]="form.notes" name="notes" placeholder="Optional context for auditors" />
    </label>
    <div class="form-actions span-2">
      <button type="button" class="btn btn-default" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="busy">
        {{ busy ? 'Recording…' : 'Record note' }}
      </button>
    </div>
  </form>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [showActions]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search reference or notes"
  emptyMessage="No notes recorded"
  emptyDescription="One-off entries recorded outside the adjustments table show up here."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
