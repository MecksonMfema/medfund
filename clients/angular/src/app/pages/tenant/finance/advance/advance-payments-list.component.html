<header class="page-header">
  <div>
    <h1>Advance payments</h1>
    <p class="page-sub">
      Provider or member prepayments captured outside the regular run
      pipeline. Append-only ledger, reversals post a compensating entry.
    </p>
  </div>
  @if (canManage) {
    <a class="btn btn-primary" routerLink="/tenant/finance/payments/advance/add">
      <app-icon name="plus" [size]="14"></app-icon>
      Record advance payment
    </a>
  }
</header>

@if (banner) {
  <div class="banner" [class.banner-success]="banner.kind === 'success'"
       [class.banner-error]="banner.kind === 'error'"
       [class.banner-info]="banner.kind === 'info'"
       (click)="banner = null">
    {{ banner.text }}
  </div>
}

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search reference, comment, provider or member"
  emptyMessage="No advance payments recorded"
  emptyDescription="Prepayments recorded outside the regular run pipeline show up here."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
