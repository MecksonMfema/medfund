<header class="page-header">
  <div>
    <h1>Advance payments</h1>
    <p class="page-sub">
      Provider or member prepayments captured outside the regular run
      pipeline. Each entry is append-only and audit-logged.
    </p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search reference, comment, provider or member"
  emptyMessage="No advance payments recorded"
  emptyDescription="Prepayments recorded outside the regular run pipeline show up here."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
