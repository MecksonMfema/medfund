<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">{{ pageDescription }}</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/finance/adjustments/new">New adjustment</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<div class="filter-strip">
  <label class="field">
    <span class="field-label">Status</span>
    <app-select
      [(ngModel)]="statusFilter"
      (selectionChange)="onStatusChange()"
      name="status"
      [options]="statusOptions"
      size="sm"
    ></app-select>
  </label>
  @if (!presetType) {
    <label class="field">
      <span class="field-label">Type</span>
      <app-select
        [(ngModel)]="typeFilter"
        (selectionChange)="onTypeChange()"
        name="type"
        [options]="typeOptions"
        size="sm"
      ></app-select>
    </label>
  }
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search adj #, reason, member or provider"
  emptyMessage="No adjustments match these filters"
  emptyDescription="Adjust the status or type filter, or record a new adjustment."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
