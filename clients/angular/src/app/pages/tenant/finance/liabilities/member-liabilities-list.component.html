<header class="page-header">
  <div>
    <h1>Member Liabilities</h1>
    <p class="page-sub">Cost-share balances owed by members from adjudicated claims. Each row is one claim's member share. Drill in to see settlements applied against it.</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<div class="tx-toolbar">
  <div class="toolbar-cell cell-search">
    <app-icon name="search" [size]="16"></app-icon>
    <input
      type="search"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      name="search"
      placeholder="Search member name, member # or claim #…"
      aria-label="Search member liabilities"
    />
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Status</span>
    <app-select
      [(ngModel)]="statusFilter"
      (selectionChange)="onFilterChange()"
      name="status"
      size="sm"
      [options]="statusOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Currency</span>
    <app-select
      [(ngModel)]="currencyFilter"
      (selectionChange)="onFilterChange()"
      name="currency"
      size="sm"
      [options]="currencyOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-clear">
    <button type="button" class="clear-btn" (click)="clearFilters()">
      <app-icon name="x-circle" [size]="14"></app-icon>
      Clear
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [searchable]="false"
  [showToolbar]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  emptyMessage="No member liabilities match these filters"
  emptyDescription="Adjust the filters above, or wait for new adjudicated claims to land."
  (pageChange)="onPageChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
