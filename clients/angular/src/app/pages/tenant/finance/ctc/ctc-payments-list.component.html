<header class="page-header">
  <div>
    <h1>CTC payments</h1>
    <p class="page-sub">
      Claims-to-Contributions transfers — approved member claim amounts
      offset against the same member's outstanding contributions. Draft
      rows post a CTC_OFFSET transaction when committed.
    </p>
  </div>
  @if (canCreate) {
    <a class="btn btn-primary" routerLink="/tenant/finance/payments/ctc/add">
      <app-icon name="plus" [size]="14"></app-icon>
      New CTC payment
    </a>
  }
</header>

@if (banner) {
  <div class="banner"
       [class.banner-success]="banner.kind === 'success'"
       [class.banner-error]="banner.kind === 'error'"
       [class.banner-info]="banner.kind === 'info'"
       (click)="banner = null">
    {{ banner.text }}
  </div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search member name, member number or group name"
  emptyMessage="No CTC payments recorded"
  emptyDescription="Drafts appear here when a MEMBER-payee claim is adjudicated or an operator records one manually."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
