<header class="page-header">
  <div>
    <h1>Disability policies</h1>
    <p class="page-sub">Income-protection cover for insured members. Each policy bills against its scheme.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/policies/disability/add">Add disability policy</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search by policy number, insured or scheme"
  emptyMessage="No disability policies yet"
  emptyDescription="Click Add disability policy to register the first one."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
