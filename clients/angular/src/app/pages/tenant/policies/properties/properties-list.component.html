<header class="page-header">
  <div>
    <h1>Properties</h1>
    <p class="page-sub">Property-insurance asset records. Each property bills against its scheme using the standard or per-asset custom premium.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/policies/properties/add">Add property</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search by property name, address, scheme or owner"
  emptyMessage="No properties yet"
  emptyDescription="Click Add property to register the first one."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
