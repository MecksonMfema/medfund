<header class="page-header">
  <div>
    <h1>Travel policies</h1>
    <p class="page-sub">Travel-insurance policies. Each policy covers a single traveller for a defined trip window.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/policies/travel/add">Add travel policy</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search by policy number, traveler, scheme or destination"
  emptyMessage="No travel policies yet"
  emptyDescription="Click Add travel policy to register the first one."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
