<header class="page-header">
  <div>
    <h1>Vehicles</h1>
    <p class="page-sub">Motor-insurance asset records. Each vehicle bills against its scheme using the standard or per-asset custom premium.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/policies/vehicles/add">Add vehicle</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search by registration, make, model, scheme or owner"
  emptyMessage="No vehicles yet"
  emptyDescription="Click Add vehicle to register the first one."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
