<header class="page-header">
  <div>
    <h1>Age groups</h1>
    <p class="page-sub">Pricing tiers per scheme. Each row is a contribution amount that applies to members in the configured age band. Currency is inherited from the parent scheme.</p>
  </div>
  <a
    *hasPermission="'billing:manage_age_groups'"
    class="btn btn-primary"
    routerLink="/tenant/billing/age-groups/add"
  >
    <app-icon name="plus" [size]="14"></app-icon>
    Add age group
  </a>
</header>

<section class="scheme-filter">
  <label class="scheme-filter__label" for="age-groups-scheme-picker">Scheme</label>
  <div class="scheme-filter__picker">
    <app-entity-picker
      kind="scheme"
      placeholder="Search schemes by name…"
      [value]="selectedSchemeId"
      [prefillLabel]="selectedSchemeName"
      [initialSuggestions]="initialSchemeSuggestions"
      (selected)="onSchemePicked($event)">
    </app-entity-picker>
  </div>
</section>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="ageGroupColumns"
  [data]="rows"
  [actions]="ageGroupActions"
  [showActions]="true"
  [loading]="loading"
  [emptyIcon]="selectedSchemeId ? 'folder-search' : 'search'"
  [emptyMessage]="selectedSchemeId
    ? 'No age groups configured for this scheme yet'
    : 'Pick a scheme to view its age groups'"
  [emptyDescription]="selectedSchemeId
    ? 'Add an age group to start pricing members in the chosen scheme.'
    : 'Use the scheme picker above to load this tenant\'s age-banded pricing tiers.'">
</app-data-table>
