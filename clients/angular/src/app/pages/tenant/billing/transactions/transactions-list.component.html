<header class="page-header">
  <div>
    <h1>{{ pageTitle }}</h1>
    <p class="page-sub">{{ pageDescription }}</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<!-- ── Filter strip ─────────────────────────────────────────────────
     Same shape as /tenant/billing/ledger's toolbar: flat strip with
     column-like cells separated by 1px vertical dividers. Search sits
     first as the wide cell, then Currency / Type / Method / From / To.
     Clear button lives at the far right of the strip. Data-table's
     built-in search is disabled ([searchable]="false") so we don't
     render two search inputs on two rows. ─────────────────────────── -->
<div class="tx-toolbar">
  <div class="toolbar-cell cell-search">
    <app-icon name="search" [size]="16"></app-icon>
    <input
      type="search"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      name="search"
      placeholder="Search receipt # or reference…"
      aria-label="Search transactions"
    />
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Currency</span>
    <app-select
      [(ngModel)]="selectedCurrency"
      (selectionChange)="onFilterChange()"
      name="currency"
      size="sm"
      [options]="currencyOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  @if (!presetType) {
    <div class="toolbar-cell cell-select">
      <span class="cell-label">Type</span>
      <app-select
        [(ngModel)]="selectedType"
        (selectionChange)="onFilterChange()"
        name="type"
        size="sm"
        [options]="typeOptions"
        placeholder="Any"
        [searchable]="false"
        [autoSearchThreshold]="9999"
      ></app-select>
    </div>
  }

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Method</span>
    <app-select
      [(ngModel)]="selectedMethod"
      (selectionChange)="onFilterChange()"
      name="method"
      size="sm"
      [options]="methodOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-date">
    <span class="cell-label">From</span>
    <input type="date" [(ngModel)]="periodStart" (change)="onFilterChange()" name="periodStart" aria-label="From" />
  </div>

  <div class="toolbar-cell cell-date">
    <span class="cell-label">To</span>
    <input type="date" [(ngModel)]="periodEnd" (change)="onFilterChange()" name="periodEnd" aria-label="To" />
  </div>

  <div class="toolbar-cell cell-clear">
    <button type="button" class="clear-btn" (click)="clearFilters()">
      <app-icon name="x-circle" [size]="14"></app-icon>
      Clear
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [showActions]="false"
  [searchable]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  emptyMessage="No transactions yet."
  (pageChange)="onPageChange($event)">
</app-data-table>
