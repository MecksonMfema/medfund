<header class="page-header">
  <div>
    <h1>Scheme-change waiting periods</h1>
    <p class="page-sub">Waits applied when a member moves between schemes. Optionally scoped to a specific benefit type — leave the benefit blank for "applies to all benefits". Initial-enrolment waits live on the Waiting Periods page.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/billing/scheme-change-waiting-periods/add">
    Add rule
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search benefit or description"
  emptyMessage="No scheme-change waiting periods configured"
  emptyDescription="Add the first rule above."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
