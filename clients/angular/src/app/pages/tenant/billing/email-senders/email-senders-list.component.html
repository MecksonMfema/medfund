<header class="page-header">
  <div>
    <h1>Email senders</h1>
    <p class="page-sub">Outbound email addresses your tenant uses for transactional and campaign mail. Only verified senders can be used by future campaigns.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/billing/email-senders/add">Add sender</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search by address, display name or notes"
  emptyMessage="No email senders configured yet"
  emptyDescription="Click Add sender to register one."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
