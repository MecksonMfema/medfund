<header class="page-header">
  <div>
    <h1>Email campaigns</h1>
    <p class="page-sub">Composed campaigns and their delivery state. Drafts can still be edited; sent campaigns are read-only with a recorded recipient count.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/billing/emails/send">Compose</a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search by subject, sender address or name"
  emptyMessage="No campaigns yet"
  emptyDescription="Use Compose to create your first draft."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
