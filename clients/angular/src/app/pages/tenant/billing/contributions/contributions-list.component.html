<header class="page-header">
  <div>
    <h1>Contribution statements</h1>
    <p class="page-sub">Browse contribution rows by status. Generate new ones from the billing wizard.</p>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<div class="filter-strip">
  <label class="field">
    <span class="field-label">Status</span>
    <app-select
      [(ngModel)]="status"
      (selectionChange)="onStatusChange()"
      name="status"
      [options]="statusOptions"
      size="sm"
    ></app-select>
  </label>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [showActions]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  searchPlaceholder="Search member, member #, group, scheme or reference"
  emptyMessage="No contributions match these filters"
  emptyDescription="Adjust the status filter, or generate a new billing run."
  (pageChange)="onPageChange($event)"
  (searchChange)="onSearchChange($event)"
  (sortChange)="onSortChange($event)">
</app-data-table>
