<div class="form-page">
  <header class="page-header">
    <h1>Add currency</h1>
    <a class="btn-link" routerLink="/tenant/billing/currencies">
      <app-icon name="arrow-left"></app-icon>
      Back to currencies
    </a>
  </header>

  <div class="error-banner" *ngIf="errorMessage" (click)="errorMessage = null">
    {{ errorMessage }}
  </div>

  <form (submit)="$event.preventDefault(); submit()">
    <label>
      Currency
      <select [(ngModel)]="selected" name="currency" required>
        <option [ngValue]="null" disabled>Choose a currency</option>
        <option *ngFor="let c of available" [value]="c.code">
          {{ c.code }} — {{ c.name }} ({{ c.symbol }})
        </option>
      </select>
    </label>

    <fieldset class="scope-flags">
      <legend>Scope</legend>
      <label><input type="checkbox" [(ngModel)]="isBillingCurrency" name="billing" /> Billing currency</label>
      <label><input type="checkbox" [(ngModel)]="isClaimsCurrency" name="claims" /> Claims currency</label>
      <label><input type="checkbox" [(ngModel)]="isPaymentCurrency" name="payments" /> Payment currency</label>
      <label><input type="checkbox" [(ngModel)]="isDefault" name="default" /> Set as default</label>
    </fieldset>

    <div class="form-actions">
      <a class="btn btn-default" routerLink="/tenant/billing/currencies">Cancel</a>
      <button class="btn btn-primary" type="submit" [disabled]="saving || !selected">
        {{ saving ? 'Adding...' : 'Add currency' }}
      </button>
    </div>
  </form>
</div>
