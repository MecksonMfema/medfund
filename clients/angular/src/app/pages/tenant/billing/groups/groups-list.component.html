<header class="page-header">
  <div>
    <h1>Groups</h1>
    <p class="page-sub">Employer or organisation groups the tenant bills. Use the Charge Preview page to project a group's next-cycle charge; open a group here to see its liaison, member roster, and running balance.</p>
  </div>
  <a *hasPermission="'billing:manage_groups'" class="btn btn-primary" routerLink="/tenant/billing/groups/add">
    <app-icon name="plus" [size]="14"></app-icon>
    Add group
  </a>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="columns"
  [data]="rows"
  [loading]="loading"
  [actions]="actions"
  [serverSide]="true"
  searchPlaceholder="Search by group name…"
  emptyMessage="No groups yet."
  (rowClick)="open($event)"
  (searchChange)="onSearch($event)">
</app-data-table>
