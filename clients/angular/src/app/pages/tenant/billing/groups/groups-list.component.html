<div class="page">
  <header class="page-header">
    <div>
      <h1>Groups</h1>
      <p class="page-sub">Employer groups participating in tenant schemes. Use Group Charge to post a one-off charge against any group balance.</p>
    </div>
    <a class="btn btn-primary" routerLink="/tenant/billing/groups/add">
      <app-icon name="plus" [size]="14"></app-icon>
      Add group
    </a>
  </header>

  @if (errorMessage) {
    <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
  }

  <app-data-table
    title="Groups"
    [columns]="columns"
    [data]="rows"
    [loading]="loading"
    [actions]="actions"
    [serverSide]="true"
    searchPlaceholder="Search by name…"
    emptyMessage="No groups yet."
    (rowClick)="open($event)"
    (searchChange)="onSearchChange($event)">
  </app-data-table>
</div>
