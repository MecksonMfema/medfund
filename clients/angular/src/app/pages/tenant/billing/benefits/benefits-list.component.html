<header class="page-header">
  <div>
    <h1>Benefits</h1>
    @if (scheme) {
      <p class="page-sub">
        Benefit lines for scheme <strong>{{ scheme.name }}</strong> ({{ scheme.currencyCode || '—' }}). Limits inherit the scheme's currency.
      </p>
    } @else {
      <p class="page-sub">Loading scheme…</p>
    }
  </div>
  <div class="header-actions">
    <a class="btn btn-default" routerLink="/tenant/billing/schemes">
      <app-icon name="arrow-left" [size]="14"></app-icon>
      Back to schemes
    </a>
    <a
      *hasPermission="'billing:manage_schemes'"
      class="btn btn-primary"
      [routerLink]="['/tenant/billing/schemes', schemeId, 'benefits', 'add']"
    >
      <app-icon name="plus" [size]="14"></app-icon>
      Add benefit
    </a>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}

<app-data-table
  [columns]="benefitColumns"
  [data]="benefits"
  [actions]="benefitActions"
  [showActions]="true"
  [loading]="loading"
  emptyMessage="No benefits configured on this scheme yet"
  emptyDescription="Add a benefit to start defining what this scheme covers and its limits.">
</app-data-table>
