<header class="page-header">
  <div>
    <h1>Producers</h1>
    <p class="page-sub">
      Broker / producer counterparties. Hierarchy is captured via parent:
      no time-slice; reparenting rewrites the field, audit trail preserved.
    </p>
  </div>
  <div class="header-actions">
    <a class="btn btn-default" routerLink="/tenant/admin/producers/rate-cards">
      <app-icon name="list" [size]="14"></app-icon>
      Rate cards
    </a>
    <a class="btn btn-primary" routerLink="/tenant/admin/producers/new">
      <app-icon name="plus" [size]="14"></app-icon>
      New producer
    </a>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}
@if (successMessage) {
  <div class="banner banner-success" (click)="successMessage = null">{{ successMessage }}</div>
}

<div class="tx-toolbar">
  <div class="toolbar-cell cell-search">
    <app-icon name="search" [size]="16"></app-icon>
    <input
      type="search"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      name="search"
      placeholder="Search code, name or contact..."
      aria-label="Search producers"
    />
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Status</span>
    <app-select
      [(ngModel)]="filterActive"
      (selectionChange)="onServerFilterChange()"
      name="status"
      size="sm"
      [options]="statusOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Currency</span>
    <app-select
      [(ngModel)]="selectedCurrency"
      (selectionChange)="onClientFilterChange()"
      name="currency"
      size="sm"
      [options]="currencyOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Jurisdiction</span>
    <app-select
      [(ngModel)]="selectedJurisdiction"
      (selectionChange)="onClientFilterChange()"
      name="jurisdiction"
      size="sm"
      [options]="jurisdictionOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-clear">
    <button type="button" class="clear-btn" (click)="clearFilters()">
      <app-icon name="x-circle" [size]="14"></app-icon>
      Clear
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [searchable]="false"
  [showToolbar]="false"
  [serverSide]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [totalPages]="totalPages"
  [serverPage]="page"
  emptyMessage="No producers yet"
  emptyDescription="Click New producer above to onboard the first broker."
  (pageChange)="onPageChange($event)">
</app-data-table>
