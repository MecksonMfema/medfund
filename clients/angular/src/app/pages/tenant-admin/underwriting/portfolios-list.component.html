<header class="page-header">
  <div>
    <h1>IFRS 17 Portfolios</h1>
    <p class="page-sub">
      Portfolios group policies for IFRS 17 reporting. The MISC portfolio is
      auto-provisioned at tenant creation and catches any policy without an
      explicit assignment.
    </p>
  </div>
  <div class="header-actions">
    <a class="btn btn-primary" routerLink="/tenant/admin/underwriting/portfolios/new">
      <app-icon name="plus" [size]="14"></app-icon>
      New portfolio
    </a>
  </div>
</header>

@if (errorMessage) {
  <div class="banner banner-error" (click)="errorMessage = null">{{ errorMessage }}</div>
}
@if (successMessage) {
  <div class="banner banner-success" (click)="successMessage = null">{{ successMessage }}</div>
}

<div class="tx-toolbar">
  <div class="toolbar-cell cell-search">
    <app-icon name="search" [size]="16"></app-icon>
    <input
      type="search"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      name="search"
      placeholder="Search name, description or line..."
      aria-label="Search portfolios"
    />
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Status</span>
    <app-select
      [ngModel]="selectedStatusValue"
      (selectionChange)="onServerFilterChange($event)"
      name="status"
      size="sm"
      [options]="statusOptions"
      placeholder="Active"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-select">
    <span class="cell-label">Line</span>
    <app-select
      [(ngModel)]="selectedLine"
      (selectionChange)="onClientFilterChange()"
      name="line"
      size="sm"
      [options]="lineOptions"
      placeholder="Any"
      [searchable]="false"
      [autoSearchThreshold]="9999"
    ></app-select>
  </div>

  <div class="toolbar-cell cell-clear">
    <button type="button" class="clear-btn" (click)="clearFilters()">
      <app-icon name="x-circle" [size]="14"></app-icon>
      Clear
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="rows"
  [actions]="actions"
  [showActions]="true"
  [searchable]="false"
  [showToolbar]="false"
  [loading]="loading"
  [pageSize]="25"
  emptyMessage="No portfolios yet"
  emptyDescription="Click New portfolio above to define your first IFRS 17 portfolio.">
</app-data-table>
