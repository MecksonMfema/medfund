<header class="page-header">
  <div>
    <h1>Claims</h1>
    <p class="page-sub">Every claim in the tenant. Filter by type, search by claim number, and open a row for the full adjudication view.</p>
  </div>
</header>

@if (showTabs) {
  <nav class="scheme-tabs" role="tablist" aria-label="Filter claims by type">
    @for (tab of typeTabs; track tab.value) {
      <button
        type="button"
        role="tab"
        class="scheme-tab"
        [class.is-active]="activeType === tab.value"
        [attr.aria-selected]="activeType === tab.value"
        (click)="selectType(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </nav>
}

<app-data-table
  [columns]="columns"
  [data]="filtered"
  [actions]="actions"
  [showActions]="true"
  [loading]="loading"
  [pageSize]="pageSize"
  [initialSortKey]="sortKey"
  [initialSortDirection]="sortDirection"
  emptyMessage="No claims yet"
  emptyDescription="Once claims are submitted they'll show up here.">
</app-data-table>
