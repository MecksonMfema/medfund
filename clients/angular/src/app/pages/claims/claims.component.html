<header class="page-header">
  <h1>Claims Management</h1>
</header>

<div class="chart-card">
  <div class="chart-header">
    <h3>Total number of claims each month</h3>
    <span class="chart-period">Last 12 months</span>
  </div>
  <div class="chart-body">
    <app-area-chart
      [data]="monthlyClaimsData"
      xAxisLabel="Month"
      yAxisLabel="Claims"
      [yScaleMax]="monthlyClaimsMax"
    ></app-area-chart>
  </div>
</div>

<section class="stats-grid">
  <app-stat-card
    label="Pending Review"
    [value]="loading ? '—' : stats.claimsNewTasks"
    color="red"
    icon="file-medical"
    actionLabel="View"
    actionLink="/claims">
  </app-stat-card>
  <app-stat-card
    label="This Month Claims"
    [value]="loading ? '—' : stats.claimsThisMonth"
    color="orange"
    icon="calendar"
    actionLabel="View"
    actionLink="/claims">
  </app-stat-card>
  <app-stat-card
    label="Claims Accepted"
    [value]="loading ? '—' : stats.claimsAcceptedThisMonth"
    color="cyan"
    icon="check-circle"
    actionLabel="View"
    actionLink="/claims">
  </app-stat-card>
</section>
