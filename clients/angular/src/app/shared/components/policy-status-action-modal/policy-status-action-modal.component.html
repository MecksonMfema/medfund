@if (open && action) {
  <div class="modal-backdrop" (click)="onCancel()">
    <div class="modal-card" (click)="$event.stopPropagation()"
         role="dialog" aria-modal="true" [attr.aria-label]="title">
      <h3 class="modal-title">{{ title }}</h3>
      <p class="modal-message">
        Confirm this action on <strong>{{ policyLabel || 'this policy' }}</strong>.
        The transition is recorded in the policy history with your identity
        and the reason you pick below.
      </p>

      <div class="field">
        <label>Reason *</label>
        <app-select
          [(ngModel)]="reasonCode"
          name="reasonCode"
          [options]="reasonOptions"
          [searchable]="false"
        ></app-select>
      </div>

      <div class="field">
        <label>Note (optional, max 500 chars)</label>
        <textarea [(ngModel)]="reasonNote" name="reasonNote" rows="3" maxlength="500"
                  placeholder="Free-text detail: audit trail only."></textarea>
      </div>

      @if (clientError) { <div class="error">{{ clientError }}</div> }
      @if (serverError) { <div class="error">{{ serverError }}</div> }

      <div class="actions">
        <button type="button" class="btn btn-default" (click)="onCancel()"
                [disabled]="submitting">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()"
                [disabled]="submitting">
          {{ submitting ? 'Applying…' : 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
