<nav class="tenant-sidebar" [class.collapsed]="collapsed">

  <!-- Header: tenant logo / initial -->
  <div class="ts-header">
    <div class="ts-tenant-badge">
      @if (logoUrl) {
        <img class="ts-tenant-logo" [src]="logoUrl" [alt]="tenantName" />
      } @else {
        <div class="ts-tenant-icon">{{ tenantInitial }}</div>
      }
      @if (!collapsed) {
        <div class="ts-tenant-info">
          <span class="ts-tenant-name">{{ tenantName }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Floating collapse / expand button — half-overlaps the sidebar's right edge -->
  <button
    class="ts-collapse-btn"
    (click)="toggleSidebar()"
    [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <app-icon [name]="collapsed ? 'chevron-right' : 'chevron-left'" [size]="14"></app-icon>
  </button>

  <!-- Portal navigation (Operational Portal / Platform Admin) lives in the
       user dropdown in the header, not here — see tenant-layout.component.html. -->

  <!-- Navigation -->
  <div class="ts-nav-scroll">
    @if (!collapsed) {
      <div class="ts-section-label">Management</div>
    }
    <ul class="ts-nav-list">
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="ts-nav-item"
            [title]="collapsed ? item.label : ''"
          >
            <span class="ts-nav-icon">
              <app-icon [name]="item.icon" [size]="20"></app-icon>
            </span>
            @if (!collapsed) {
              <span class="ts-nav-label">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </div>

  <!-- Footer -->
  <div class="ts-footer">
    <button class="ts-logout-btn" (click)="logout()" [title]="collapsed ? 'Sign out' : ''">
      <app-icon name="logout" [size]="18"></app-icon>
      @if (!collapsed) {
        <span>Sign out</span>
      }
    </button>
  </div>

</nav>
