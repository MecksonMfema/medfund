<nav class="tenant-sidebar" [class.collapsed]="collapsed">

  <!-- Header: tenant logo / initial -->
  <div class="ts-header">
    <div class="ts-tenant-badge">
      @if (logoUrl) {
        <img class="ts-tenant-logo" [src]="logoUrl" [alt]="tenantName" />
      } @else {
        <div class="ts-tenant-icon">{{ tenantInitial }}</div>
      }
      @if (!collapsed) {
        <div class="ts-tenant-info">
          <span class="ts-tenant-name">{{ tenantName }}</span>
        </div>
      }
    </div>
    <button class="ts-collapse-btn" (click)="toggleSidebar()" [title]="collapsed ? 'Expand' : 'Collapse'">
      <app-icon [name]="collapsed ? 'chevron-right' : 'chevron-left'" [size]="16"></app-icon>
    </button>
  </div>

  <!-- Back to Platform (super admin only path) -->
  <div class="ts-back">
    <button class="ts-back-btn" (click)="backToPlatform()" [title]="collapsed ? 'Back to Platform' : ''">
      <app-icon name="arrow-left" [size]="16"></app-icon>
      @if (!collapsed) {
        <span>Platform Admin</span>
      }
    </button>
  </div>

  <!-- Navigation -->
  <div class="ts-nav-scroll">
    @if (!collapsed) {
      <div class="ts-section-label">Management</div>
    }
    <ul class="ts-nav-list">
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="ts-nav-item"
            [title]="collapsed ? item.label : ''"
          >
            <span class="ts-nav-icon">
              <app-icon [name]="item.icon" [size]="20"></app-icon>
            </span>
            @if (!collapsed) {
              <span class="ts-nav-label">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </div>

  <!-- Footer -->
  <div class="ts-footer">
    <button class="ts-logout-btn" (click)="logout()" [title]="collapsed ? 'Sign out' : ''">
      <app-icon name="logout" [size]="18"></app-icon>
      @if (!collapsed) {
        <span>Sign out</span>
      }
    </button>
  </div>

</nav>
